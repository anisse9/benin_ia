<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#112B0D"/>
      <stop offset="100%" stop-color="#061808"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#2A8850" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2A8850" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3AA060"/>
      <stop offset="100%" stop-color="#1F6B3A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#sol)"/>

  <!-- Horizon line -->
  <line x1="0" y1="310" x2="800" y2="310" stroke="#2A8850" stroke-width="0.6" opacity="0.3"/>

  <!-- Ground texture -->
  <ellipse cx="400" cy="380" rx="320" ry="40" fill="#1F6B3A" opacity="0.12"/>

  <!-- Corn / maize plants — stylized -->
  <!-- Plant 1 - left -->
  <line x1="210" y1="360" x2="210" y2="190" stroke="#2A8850" stroke-width="6" stroke-linecap="round"/>
  <path d="M210 260 Q240 230 268 240" fill="none" stroke="url(#leaf)" stroke-width="12" stroke-linecap="round"/>
  <path d="M210 220 Q178 195 155 205" fill="none" stroke="url(#leaf)" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="210" cy="185" rx="10" ry="25" fill="#D9A404" opacity="0.9"/>

  <!-- Plant 2 - center -->
  <line x1="400" y1="360" x2="400" y2="155" stroke="#2A8850" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 250 Q438 215 468 228" fill="none" stroke="url(#leaf)" stroke-width="14" stroke-linecap="round"/>
  <path d="M400 200 Q360 170 330 182" fill="none" stroke="url(#leaf)" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="400" cy="148" rx="12" ry="30" fill="#D9A404" opacity="0.9"/>

  <!-- Plant 3 - right -->
  <line x1="590" y1="360" x2="590" y2="195" stroke="#2A8850" stroke-width="6" stroke-linecap="round"/>
  <path d="M590 268 Q620 240 645 252" fill="none" stroke="url(#leaf)" stroke-width="11" stroke-linecap="round"/>
  <path d="M590 228 Q558 200 532 212" fill="none" stroke="url(#leaf)" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="590" cy="188" rx="10" ry="26" fill="#D9A404" opacity="0.9"/>

  <!-- Phone / tablet overlay (top right) -->
  <g transform="translate(600,60)">
    <rect width="120" height="190" rx="14" fill="#0B2E1C" stroke="#2A8850" stroke-width="2"/>
    <rect x="8" y="16" width="104" height="140" rx="6" fill="#0F3D20"/>
    <!-- Screen content - bar chart -->
    <rect x="18" y="120" width="18" height="30" rx="3" fill="#2A8850" opacity="0.9"/>
    <rect x="42" y="100" width="18" height="50" rx="3" fill="#2A8850" opacity="0.9"/>
    <rect x="66" y="85"  width="18" height="65" rx="3" fill="#D9A404" opacity="0.85"/>
    <rect x="90" y="110" width="18" height="40" rx="3" fill="#2A8850" opacity="0.7"/>
    <!-- Label on phone -->
    <text x="60" y="170" text-anchor="middle" font-size="9" font-weight="700"
          font-family="system-ui" fill="#D9A404" opacity="0.9">KORA AI</text>
    <!-- Phone notch -->
    <rect x="44" y="6" width="32" height="6" rx="3" fill="#1F6B3A"/>
    <!-- Home button -->
    <circle cx="60" cy="178" r="7" fill="none" stroke="#2A8850" stroke-width="1.5"/>
  </g>

  <!-- Data signal waves from phone -->
  <g opacity="0.4" stroke="#D9A404" fill="none" stroke-width="1.2">
    <path d="M598 115 Q570 100 550 115"/>
    <path d="M598 115 Q558 85 525 105"/>
    <path d="M598 115 Q545 68 500 95"/>
  </g>

  <!-- GPS pin on center plant -->
  <circle cx="400" cy="148" r="18" fill="#D9A404" opacity="0.15"/>
  <circle cx="400" cy="148" r="6" fill="#D9A404" opacity="0.7"/>

  <!-- Stars / data points -->
  <g fill="#D9A404" opacity="0.45">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="60" cy="130" r="1.5"/>
    <circle cx="140" cy="110" r="2"/>
    <circle cx="700" cy="60" r="1.5"/>
    <circle cx="730" cy="40" r="2"/>
  </g>

  <!-- Label -->
  <rect x="200" y="412" width="400" height="30" rx="8" fill="#1F6B3A" opacity="0.3"/>
  <text x="400" y="433" text-anchor="middle" font-size="15" font-weight="700"
        font-family="'DM Sans',system-ui,sans-serif" fill="white" letter-spacing="2.5" opacity="0.95">CONSEILLER AGRICOLE IA</text>
</svg>
