<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A8850"/>
      <stop offset="100%" stop-color="#0F3D20"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C64A"/>
      <stop offset="100%" stop-color="#D9A404"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="38" fill="url(#bg)"/>

  <!-- Kora strings (3 arched curves — référence à l'instrument kora) -->
  <path d="M52 42 Q96 100 52 158" fill="none" stroke="#D9A404" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M60 48 Q108 100 60 152" fill="none" stroke="#D9A404" stroke-width="2.5" stroke-linecap="round" opacity="0.50"/>
  <path d="M68 55 Q120 100 68 145" fill="none" stroke="#D9A404" stroke-width="1.8" stroke-linecap="round" opacity="0.30"/>

  <!-- K — stem -->
  <rect x="44" y="42" width="22" height="116" rx="9" fill="white"/>

  <!-- K — upper arm -->
  <polygon points="66,100 148,42 148,66 80,106" fill="white"/>

  <!-- K — lower arm -->
  <polygon points="66,100 148,158 138,180 72,112" fill="white"/>

  <!-- Gold AI badge -->
  <rect x="118" y="142" width="50" height="28" rx="8" fill="url(#gold)"/>
  <text x="143" y="162" text-anchor="middle" font-size="14" font-weight="900"
        font-family="'DM Sans',system-ui,sans-serif" fill="#123524" letter-spacing="0.5">AI</text>
</svg>
