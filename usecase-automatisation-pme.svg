<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1E2E"/>
      <stop offset="100%" stop-color="#060D14"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#0F2440"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#1F6B3A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1F6B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="#1F4060" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Document stack — left side -->
  <!-- Back document -->
  <rect x="120" y="140" width="180" height="220" rx="8" fill="#102030" stroke="#1F4060" stroke-width="1.5"/>
  <line x1="145" y1="175" x2="275" y2="175" stroke="#1F6B3A" stroke-width="1.5" opacity="0.5"/>
  <line x1="145" y1="195" x2="275" y2="195" stroke="#1F6B3A" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="212" x2="245" y2="212" stroke="#1F6B3A" stroke-width="1" opacity="0.35"/>

  <!-- Middle document -->
  <rect x="135" y="128" width="180" height="220" rx="8" fill="#142840" stroke="#2A5070" stroke-width="1.5"/>
  <line x1="162" y1="165" x2="292" y2="165" stroke="#2A8850" stroke-width="1.5" opacity="0.55"/>
  <line x1="162" y1="185" x2="292" y2="185" stroke="#2A8850" stroke-width="1" opacity="0.4"/>
  <line x1="162" y1="202" x2="262" y2="202" stroke="#2A8850" stroke-width="1" opacity="0.35"/>
  <line x1="162" y1="218" x2="240" y2="218" stroke="#2A8850" stroke-width="1" opacity="0.3"/>

  <!-- Front document -->
  <rect x="150" y="115" width="180" height="220" rx="8" fill="url(#doc)" stroke="#3A6080" stroke-width="1.5"/>
  <!-- Doc header bar -->
  <rect x="150" y="115" width="180" height="28" rx="8" fill="#1F6B3A" opacity="0.6"/>
  <rect x="150" y="130" width="180" height="13" fill="#1F6B3A" opacity="0.6"/>
  <!-- Doc lines -->
  <line x1="175" y1="165" x2="305" y2="165" stroke="#D9A404" stroke-width="2" opacity="0.7"/>
  <line x1="175" y1="185" x2="305" y2="185" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="175" y1="202" x2="285" y2="202" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="175" y1="218" x2="295" y2="218" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="175" y1="234" x2="260" y2="234" stroke="white" stroke-width="1" opacity="0.2"/>
  <!-- Checkmark -->
  <circle cx="168" cy="280" r="14" fill="#1F6B3A" opacity="0.6"/>
  <polyline points="161,280 166,286 176,273" fill="none" stroke="#D9A404" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Automation arrows (center) -->
  <g fill="#D9A404" opacity="0.7">
    <!-- Right arrow 1 -->
    <path d="M360 200 L400 200 L392 192 M400 200 L392 208" fill="none" stroke="#D9A404" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arrow 2 -->
    <path d="M360 225 L400 225 L392 217 M400 225 L392 233" fill="none" stroke="#D9A404" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- AI processor — center -->
  <g transform="translate(420,155)">
    <rect width="100" height="100" rx="14" fill="#0F2820" stroke="#2A8850" stroke-width="2"/>
    <rect x="14" y="14" width="72" height="72" rx="10" fill="#1A3D28"/>
    <text x="50" y="56" text-anchor="middle" font-size="20" font-weight="900"
          font-family="system-ui" fill="#D9A404">AI</text>
    <text x="50" y="75" text-anchor="middle" font-size="8" font-weight="600"
          font-family="system-ui" fill="#2A8850" opacity="0.85">KORA</text>
    <!-- Pins -->
    <line x1="0" y1="28" x2="14" y2="28" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="0" y1="50" x2="14" y2="50" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="0" y1="72" x2="14" y2="72" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="100" y1="28" x2="86" y2="28" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="100" y1="50" x2="86" y2="50" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="100" y1="72" x2="86" y2="72" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="28" y1="0" x2="28" y2="14" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="50" y1="0" x2="50" y2="14" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="72" y1="0" x2="72" y2="14" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="28" y1="100" x2="28" y2="86" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="50" y1="100" x2="50" y2="86" stroke="#2A8850" stroke-width="1.8"/>
    <line x1="72" y1="100" x2="72" y2="86" stroke="#2A8850" stroke-width="1.8"/>
  </g>

  <!-- Output doc — right side -->
  <g transform="translate(570,155)">
    <rect width="130" height="155" rx="8" fill="#0B2A18" stroke="#2A8850" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="#1F6B3A" opacity="0.7"/>
    <rect x="0" y="12" width="130" height="12" fill="#1F6B3A" opacity="0.7"/>
    <line x1="18" y1="48" x2="112" y2="48" stroke="#2A8850" stroke-width="1.5" opacity="0.7"/>
    <line x1="18" y1="65" x2="112" y2="65" stroke="#2A8850" stroke-width="1" opacity="0.5"/>
    <line x1="18" y1="80" x2="90"  y2="80" stroke="#2A8850" stroke-width="1" opacity="0.4"/>
    <!-- Checkmarks -->
    <circle cx="30" cy="108" r="10" fill="#1F6B3A" opacity="0.5"/>
    <polyline points="24,108 28,113 36,102" fill="none" stroke="#D9A404" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="108" r="10" fill="#1F6B3A" opacity="0.5"/>
    <polyline points="59,108 63,113 71,102" fill="none" stroke="#D9A404" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="108" r="10" fill="#1F6B3A" opacity="0.5"/>
    <polyline points="94,108 98,113 106,102" fill="none" stroke="#D9A404" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Processed badge -->
    <rect x="22" y="130" width="86" height="18" rx="5" fill="#D9A404" opacity="0.2"/>
    <text x="65" y="143" text-anchor="middle" font-size="8" font-weight="700"
          font-family="system-ui" fill="#D9A404">TRAITÉ · CLASSÉ</text>
  </g>

  <!-- Arrow after processor -->
  <path d="M520 205 L567 205 L560 197 M567 205 L560 213" fill="none" stroke="#D9A404" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Label -->
  <rect x="190" y="412" width="420" height="30" rx="8" fill="#1A3040" opacity="0.5"/>
  <text x="400" y="433" text-anchor="middle" font-size="15" font-weight="700"
        font-family="'DM Sans',system-ui,sans-serif" fill="white" letter-spacing="2.5" opacity="0.95">AUTOMATISATION DOCUMENTAIRE IA</text>
</svg>
