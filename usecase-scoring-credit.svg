<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1F18"/>
      <stop offset="100%" stop-color="#060E0A"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8850"/>
      <stop offset="100%" stop-color="#1F6B3A"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C64A"/>
      <stop offset="100%" stop-color="#D9A404"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1F6B3A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1F6B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#1F6B3A" stroke-width="0.4" opacity="0.2">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Credit score gauge (semicircle) — left -->
  <g transform="translate(230,270)">
    <!-- Track -->
    <path d="M -140 0 A 140 140 0 0 1 140 0" fill="none" stroke="#1F3020" stroke-width="22" stroke-linecap="round"/>
    <!-- Score fill (75% = green zone) -->
    <path d="M -140 0 A 140 140 0 0 1 70 -120" fill="none" stroke="url(#bar2)" stroke-width="22" stroke-linecap="round"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="60" fill="#0E1F18"/>
    <!-- Score number -->
    <text x="0" y="-10" text-anchor="middle" font-size="38" font-weight="900"
          font-family="system-ui" fill="#D9A404">782</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="600"
          font-family="system-ui" fill="#2A8850" opacity="0.85">SCORE IA</text>
    <!-- Needle -->
    <line x1="0" y1="0" x2="65" y2="-112" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="white" opacity="0.9"/>
    <!-- Scale labels -->
    <text x="-148" y="22" text-anchor="middle" font-size="10" fill="#2A8850" opacity="0.6">300</text>
    <text x="148" y="22"  text-anchor="middle" font-size="10" fill="#2A8850" opacity="0.6">850</text>
  </g>

  <!-- Phone — center/right -->
  <g transform="translate(440,70)">
    <rect width="140" height="240" rx="18" fill="#0B1E12" stroke="#2A8850" stroke-width="2"/>
    <rect x="9" y="18" width="122" height="178" rx="8" fill="#0F2A18"/>
    <!-- Notch -->
    <rect x="52" y="7" width="36" height="8" rx="4" fill="#1F6B3A"/>
    <!-- Screen content -->
    <!-- Header -->
    <rect x="9" y="18" width="122" height="28" rx="8" fill="#1F6B3A" opacity="0.5"/>
    <rect x="9" y="33" width="122" height="13" fill="#1F6B3A" opacity="0.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="10" font-weight="700"
          font-family="system-ui" fill="white">Mobile Money IA</text>
    <!-- Balance -->
    <text x="70" y="75" text-anchor="middle" font-size="11" font-weight="600"
          font-family="system-ui" fill="#2A8850" opacity="0.8">Solde disponible</text>
    <text x="70" y="98" text-anchor="middle" font-size="22" font-weight="900"
          font-family="system-ui" fill="#D9A404">245 000</text>
    <text x="70" y="112" text-anchor="middle" font-size="9" font-weight="600"
          font-family="system-ui" fill="#D9A404" opacity="0.7">FCFA</text>
    <!-- Mini bars -->
    <rect x="22" y="155" width="14" height="28" rx="3" fill="#2A8850" opacity="0.7"/>
    <rect x="42" y="143" width="14" height="40" rx="3" fill="#2A8850" opacity="0.7"/>
    <rect x="62" y="133" width="14" height="50" rx="3" fill="url(#bar2)" opacity="0.9"/>
    <rect x="82" y="148" width="14" height="35" rx="3" fill="#2A8850" opacity="0.6"/>
    <rect x="102" y="138" width="14" height="45" rx="3" fill="#2A8850" opacity="0.8"/>
    <!-- Home button -->
    <circle cx="70" cy="228" r="9" fill="none" stroke="#2A8850" stroke-width="1.5"/>
  </g>

  <!-- Connection line gauge → phone -->
  <path d="M370 185 Q405 170 440 160" fill="none" stroke="#D9A404" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Coins / currency symbols -->
  <g opacity="0.45">
    <circle cx="620" cy="280" r="28" fill="none" stroke="#D9A404" stroke-width="2"/>
    <text x="620" y="288" text-anchor="middle" font-size="22" font-weight="900"
          font-family="system-ui" fill="#D9A404">₣</text>
    <circle cx="680" cy="320" r="18" fill="none" stroke="#D9A404" stroke-width="1.5" opacity="0.6"/>
    <text x="680" y="327" text-anchor="middle" font-size="14" font-weight="900"
          font-family="system-ui" fill="#D9A404" opacity="0.6">₣</text>
    <circle cx="655" cy="250" r="12" fill="none" stroke="#D9A404" stroke-width="1.2" opacity="0.4"/>
    <text x="655" y="256" text-anchor="middle" font-size="10" font-weight="900"
          font-family="system-ui" fill="#D9A404" opacity="0.4">₣</text>
  </g>

  <!-- Trend line (top right) -->
  <polyline
    points="560,340 590,310 620,320 650,285 680,295 720,255 750,260"
    fill="none" stroke="#2A8850" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <circle cx="750" cy="260" r="5" fill="#D9A404" opacity="0.8"/>

  <!-- AI badge (bottom left corner) -->
  <rect x="60" y="380" width="56" height="24" rx="6" fill="#1F6B3A" opacity="0.5"/>
  <text x="88" y="396" text-anchor="middle" font-size="10" font-weight="800"
        font-family="system-ui" fill="#D9A404">KORA AI</text>

  <!-- Label -->
  <rect x="185" y="412" width="430" height="30" rx="8" fill="#1F3020" opacity="0.5"/>
  <text x="400" y="433" text-anchor="middle" font-size="15" font-weight="700"
        font-family="'DM Sans',system-ui,sans-serif" fill="white" letter-spacing="2.5" opacity="0.95">SCORING CRÉDIT &amp; INCLUSION FINANCIÈRE</text>
</svg>
